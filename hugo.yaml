# Hugo configuration file
title: GCVE initiative - Global CVE Allocation System 
baseurl: https://gcve.eu/
enableRobotsTXT: true

author:
   name: "GCVE"
   email: "info@gcve.eu"

# import hextra as module
module:
  imports:
  - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

enableInlineShortcodes: true

outputs:
  home: [HTML]
  page: [HTML]
  section: [HTML, RSS]
  news: [HTML, RSS]

taxonomies:
  series: series
  tags: tags

menu:
  main:
    - identifier: about 
      name: About
      pageRef: /about
      weight: 1
    - name: FAQ 
      pageRef: /faq
      weight: 2
    - name: BCP
      pageRef: /bcp
      weight: 3
    - name: Contact
      pageRef: /contact
      weight: 4
    - name: News
      pageRef: /news
      weight: 5
    - name: Software
      pageRef: /software
      weight: 6
    - name: Open Data
      pageRef: /opendata
      weight: 7
    - name: db.gcve.eu
      url: "https://db.gcve.eu/"
      params:
        icon: database
      weight: 7
    - name: Search
      weight: 7
      params:
        type: search
    - name: Mastodon
      weight: 7
      url: "https://social.circl.lu/@gcve"
      params:
        icon: mastodon
    - name: GitHub
      weight: 8
      url: "https://github.com/gcve-eu/"
      params:
        icon: github
    - name: LinkedIn
      weight: 9
      url: "https://www.linkedin.com/company/107254810"
      params:
        icon: linkedin
    - name: Discourse
      weight: 10
      url: "https://discourse.ossbase.org/c/gcve/14"
      params:
        icon: chat 


params:
  page:
    # full (100%), wide (90rem), normal (1280px)
    width: wide

  navbar:
    displayTitle: true
    displayLogo: true 

  news:
    list:
      displayTags: true
      # date | lastmod | publishDate | title | weight
      sortBy: date
      sortOrder: desc # or "asc"

  footer:
    displayCopyright: false
    displayPoweredBy: false
  author:
    name: "GCVE"
    email: "info@gcve.eu"

permalinks:
  news: '/:year/:month/:day/:slug/'
